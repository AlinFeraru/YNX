name: Synchronize verified v0.16.10 release source
on:
  push:
    paths:
      - '.github/workflows/sync-ynx-01610.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify exact released installation ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error -o /tmp/ynx-release.zip "https://github.com/AlinFeraru/YNX/releases/download/v0.16.10/YNX.zip"
          echo "93d15bcf6d2598175f2bce9fb9f56dd43aefbf4fe298b085c30d7849b0b2337a  /tmp/ynx-release.zip" | sha256sum --check -
          mkdir -p /tmp/ynx-unpacked
          unzip -q /tmp/ynx-release.zip -d /tmp/ynx-unpacked
          test -f /tmp/ynx-unpacked/YNX/YNX.toc
          test -f /tmp/ynx-unpacked/YNX/UI.lua
          test -f /tmp/ynx-unpacked/YNX/Locales.lua
          grep -q '^## Version: 0.16.10-beta-hotfix1$' /tmp/ynx-unpacked/YNX/YNX.toc
      - name: Replace source with verified release, commit to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf YNX
          cp -a /tmp/ynx-unpacked/YNX ./YNX
          git add --all -- YNX
          if git diff --cached --quiet; then echo "Already synchronized."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync YNX source with v0.16.10 release ZIP"
          git push origin HEAD:main
